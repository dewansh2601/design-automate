# .github/workflows/run-setup.yml
#
# Manually triggered ("Run workflow" button in the Actions tab) run of
# setup_project.sh against real AWS resources.
#
# REQUIRED REPO SETUP BEFORE FIRST RUN:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     AWS_ACCESS_KEY_ID     - IAM user/role access key
#     AWS_SECRET_ACCESS_KEY - IAM user/role secret key
#     PARAM_VALUE           - SSM parameter value
#
#   Settings -> Secrets and variables -> Actions -> Variables
#     PROJECT_NAME          - project name
#     FOLDER_NAME           - folder name to create inside the project
#
#   NOTE ON SCRIPT INJECTION: inputs/secrets are always passed into steps
#   via an `env:` block and read as $VAR_NAME inside the shell script -
#   never interpolated directly as ${{ ... }} inside a run: script body.
#   Direct interpolation lets a crafted input (e.g. containing backticks
#   or $()) break out of the string and execute arbitrary commands on
#   the runner. Passing through env: avoids that entirely.

name: Run Design Automate

on:
  workflow_dispatch:

jobs:
  run-setup:
    name: Create S3 folders + SSM parameter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve and mask parameter value
        env:
          PARAM_VALUE_SECRET: ${{ secrets.PARAM_VALUE }}
        run: |
          VALUE="$PARAM_VALUE_SECRET"
          if [[ -n "$VALUE" ]]; then
            echo "::add-mask::$VALUE"
            echo "RESOLVED_PARAM_VALUE=$VALUE" >> "$GITHUB_ENV"
          fi

      - name: Resolve project and folder
        env:
          PROJECT_NAME_VAR: ${{ vars.PROJECT_NAME }}
          FOLDER_NAME_VAR: ${{ vars.FOLDER_NAME }}
        run: |
          PROJECT="$PROJECT_NAME_VAR"
          FOLDER="$FOLDER_NAME_VAR"
          if [[ -z "$PROJECT" ]]; then
            echo "::error::PROJECT_NAME repo variable is not set."
            exit 1
          fi
          if [[ -z "$FOLDER" ]]; then
            echo "::error::FOLDER_NAME repo variable is not set."
            exit 1
          fi
          echo "PROJECT_NAME=$PROJECT" >> "$GITHUB_ENV"
          echo "FOLDER_NAME=$FOLDER" >> "$GITHUB_ENV"
          echo "Resolved path: ${PROJECT}/${FOLDER}"

      - name: Run setup script
        env:
          PARAM_VALUE: ${{ env.RESOLVED_PARAM_VALUE }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          FOLDER_NAME: ${{ env.FOLDER_NAME }}
        run: |
          chmod +x ./.github/workflows/setup_project.sh
          ./.github/workflows/setup_project.sh \
            --project "$PROJECT_NAME" \
            --folder "$FOLDER_NAME"
