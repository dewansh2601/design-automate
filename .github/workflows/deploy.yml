name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"

      #This will be added on org level
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
      VITE_UFP_ENABLED: ${{ vars.VITE_UFP_ENABLED }}
      VITE_UFP_PROVIDER: ${{ vars.VITE_UFP_PROVIDER }}
      VITE_UFP_AWS_REGION: ${{ vars.AWS_REGION }}
      VITE_UFP_AWS_BUCKET: ${{ vars.VITE_UFP_AWS_BUCKET }}
      VITE_UFP_AWS_IDENTITY_POOL_ID: ${{ vars.VITE_UFP_AWS_IDENTITY_POOL_ID }}

      #This will be repo level.
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      FOLDER_NAME: ${{ vars.FOLDER_NAME }}
      VITE_UFP_PROJECT_KEY: ${{ vars.VITE_UFP_PROJECT_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --base=/${PROJECT_NAME}/${FOLDER_NAME}/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static assets to S3
        run: |
          aws s3 sync dist s3://${S3_BUCKET}/${PROJECT_NAME}/${FOLDER_NAME}/ --delete --exclude "index.html"

      - name: Sync index.html with no-cache headers
        run: |
          aws s3 sync dist s3://${S3_BUCKET}/${PROJECT_NAME}/${FOLDER_NAME}/ \
            --exclude "*" \
            --include "index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
